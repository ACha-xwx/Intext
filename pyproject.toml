[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsmith"
version = "0.1.0"
description = "需求引导式提示构建助手"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "pillow>=10,<13", "pywebview>=6.2,<7; sys_platform == 'win32'"]

[project.scripts]
promptsmith = "promptsmith.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
